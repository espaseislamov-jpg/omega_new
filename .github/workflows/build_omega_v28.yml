name: Build Omega 2.8 Windows setup

on:
  push:
    branches: [fix/peak-boundaries-profile-continuity]
    paths:
      - '.github/workflows/build_omega_v28.yml'
      - 'installer/omega_v2.iss'
      - 'omega_v2.py'
      - 'New_idea.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-setup:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-chromatopy.txt
          python -m pip install "pyinstaller>=6,<7"
      - name: Run regression unit tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python scripts/build_omega_v2.py --skip-deps
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler installer/omega_v2.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path installer_output/omega_v2.8_setup.exe)) { throw "Installer missing" }
          Get-FileHash installer_output/omega_v2.8_setup.exe -Algorithm SHA256 | Format-List
      - name: Verify installed application and CSV processing
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'Омега проверка'
          $setup = Start-Process -FilePath installer_output/omega_v2.8_setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          $csv = Join-Path $env:GITHUB_WORKSPACE 'data/regression/25032026.CSV'
          $app = Start-Process -FilePath (Join-Path $installDir 'omega_v2.exe') -WorkingDirectory $env:RUNNER_TEMP -ArgumentList @('--smoke-test', '--smoke-csv', ('"' + $csv + '"')) -PassThru
          if (!$app.WaitForExit(120000)) { Stop-Process -Id $app.Id; throw 'Application startup timed out' }
          $log = Join-Path $env:LOCALAPPDATA 'Omega/logs/startup.log'
          if (Test-Path $log) { Get-Content $log }
          if ($app.ExitCode -ne 0) { throw "Application failed: $($app.ExitCode)" }
          if (!(Test-Path $log) -or !(Select-String -Path $log -Pattern 'OMEGA_SMOKE_OK' -Quiet)) { throw 'Application did not finish its smoke test' }
      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: omega_v2.8_windows_setup
          path: installer_output/omega_v2.8_setup.exe
          if-no-files-found: error
          retention-days: 30
